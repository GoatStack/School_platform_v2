<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <h1 class="logo">DEV</h1>
            <div class="auth-nav">
                <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
                    <span id="themeIcon">☽</span>
                </button>
                <a href="/" class="back-btn">← 메인으로</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="register-section">
            <div class="register-container">
                <div class="login-form-wrapper">
                    <h2 class="login-title">회원가입</h2>
                    <p class="login-subtitle">덕영고등학교 Make-DEV 서비스</p>
                    
                    <form id="signupForm" class="login-form-simple">
                        <input type="email" id="email" name="email" required placeholder="이메일을 입력하세요" class="login-input">
                        <input type="text" id="username" name="username" required placeholder="아이디를 입력하세요 (3~20자)" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_-]+" class="login-input">
                        <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요" minlength="6" class="login-input">
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="비밀번호를 다시 입력하세요" class="login-input">
                        <div id="passwordMatchStatus" class="password-status"></div>
                        
                        <input type="text" id="fullName" name="fullName" required placeholder="이름을 입력하세요" class="login-input">
                        
                        <select id="grade" name="grade" required class="login-input">
                            <option value="">학년 선택</option>
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                        </select>
                        
                        <input type="text" id="className" name="className" required placeholder="반을 입력하세요" class="login-input">
                        <input type="number" id="studentNumber" name="studentNumber" required placeholder="번호를 입력하세요" min="1" max="50" class="login-input">
                        
                        <button type="submit" class="login-submit-btn">회원가입</button>
                    </form>
                    
                    <div class="login-link">
                        <p>이미 계정이 있으신가요? <a href="/login" class="signup-link">로그인하기</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 승인 대기 모달 -->
    <div id="pendingModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>회원가입 완료</h3>
            </div>
            <div class="modal-body">
                <p>회원가입이 완료되었습니다!</p>
                <p>관리자 승인 후 로그인이 가능합니다.</p>
                <p>승인까지 1-2일 정도 소요될 수 있습니다.</p>
            </div>
            <div class="modal-actions">
                <button id="closePendingModalBtn" class="btn-primary">확인</button>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
