<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="css/styles.css?v=2.0">
    <link rel="stylesheet" href="css/login.css?v=2.0">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <h1 class="logo">DEV</h1>
            <div class="auth-nav">
                <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
                    <span id="themeIcon">☽</span>
                </button>
                <a href="/" class="back-btn">← 메인으로</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="register-section">
            <div class="register-container">
                <div class="login-form-wrapper">
                    <h2 class="login-title">로그인</h2>
                    <p class="login-subtitle">덕영고등학교 Make-DEV 서비스</p>
                    
                    <form id="loginForm" class="login-form-simple">
                        <input type="text" id="login" name="login" required placeholder="이메일 또는 아이디를 입력하세요" class="login-input" autocomplete="username">
                        <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요" class="login-input" autocomplete="current-password">
                        
                        <button type="submit" class="login-submit-btn">로그인</button>
                    </form>
                    
                    <div class="login-link">
                        <p>계정이 없으신가요? <a href="/signup" class="signup-link">회원가입하기</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 승인 대기 모달 -->
    <div id="pendingModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>로그인 불가</h3>
            </div>
            <div class="modal-body">
                <p><strong>관리자 승인 후 로그인이 가능합니다.</strong></p>
                <p>승인까지 1-2일 정도 소요될 수 있습니다.</p>
                <p>문의사항이 있으시면 관리자에게 연락하세요.</p>
            </div>
            <div class="modal-actions">
                <button id="closePendingModalBtn" class="btn-primary">확인</button>
            </div>
        </div>
    </div>

    <!-- 거부 모달 -->
    <div id="rejectedModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>로그인 불가</h3>
            </div>
            <div class="modal-body">
                <p>회원가입이 거부되었습니다.</p>
                <p>관리자에게 문의하세요.</p>
            </div>
            <div class="modal-actions">
                <button id="closeRejectedModalBtn" class="btn-primary">확인</button>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
